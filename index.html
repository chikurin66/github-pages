<!doctype html>
<html lang="ja">
<head>
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-495M5TSWV0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-495M5TSWV0');

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yuto Takebayashi</title>
  <script src="https://kit.fontawesome.com/0fd8d60675.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'Meiryo', sans-serif;
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }

    /* === Desktop === */
    #desktop {
      width: 100%;
      height: calc(100vh - 48px);
      background: url('img/camp2.png') center/cover no-repeat;
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      padding: 20px;
      gap: 8px;
    }

    /* === Desktop Icons === */
    .desktop-icon {
      width: 90px;
      text-align: center;
      padding: 8px 4px;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
    .desktop-icon:hover {
      background: rgba(255,255,255,0.15);
    }
    .desktop-icon.selected {
      background: rgba(255,255,255,0.25);
    }
    .desktop-icon img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      margin: 0 auto 6px;
    }
    .desktop-icon .icon-placeholder {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 6px;
      font-size: 24px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
    }
    .desktop-icon span {
      font-size: 11px;
      line-height: 1.3;
      display: block;
      word-wrap: break-word;
    }

    /* === Taskbar === */
    #taskbar {
      width: 100%;
      height: 48px;
      background: rgba(24, 24, 32, 0.92);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      padding: 0 8px;
      position: fixed;
      bottom: 0;
      z-index: 1000;
    }
    #start-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #start-btn:hover {
      background: rgba(255,255,255,0.1);
    }
    #taskbar-items {
      display: flex;
      flex: 1;
      margin-left: 8px;
      gap: 2px;
      overflow: hidden;
    }
    .taskbar-item {
      height: 36px;
      padding: 0 12px;
      background: rgba(255,255,255,0.05);
      border: none;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      max-width: 160px;
      overflow: hidden;
    }
    .taskbar-item:hover {
      background: rgba(255,255,255,0.12);
    }
    .taskbar-item.active {
      background: rgba(255,255,255,0.18);
      border-bottom: 2px solid #60cdff;
    }
    .taskbar-item img {
      width: 18px;
      height: 18px;
      object-fit: cover;
      border-radius: 3px;
    }
    #taskbar-clock {
      color: #fff;
      font-size: 12px;
      text-align: right;
      padding: 0 12px;
      line-height: 1.4;
    }
    #taskbar-sns {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-right: 8px;
    }
    #taskbar-sns a {
      color: #aaa;
      font-size: 16px;
      text-decoration: none;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    #taskbar-sns a:hover {
      color: #fff;
      background: rgba(255,255,255,0.1);
    }

    /* === Start Menu === */
    #start-menu {
      display: none;
      position: fixed;
      bottom: 56px;
      left: 8px;
      width: 360px;
      background: rgba(32, 32, 40, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 8px;
      color: #fff;
      padding: 24px;
      z-index: 2000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #start-menu.show { display: block; }
    #start-menu h3 {
      font-size: 18px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    #start-menu .profile-info p {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 6px;
      line-height: 1.5;
    }
    #start-menu .profile-info p strong {
      color: #fff;
    }

    /* === Windows === */
    .window {
      position: absolute;
      min-width: 320px;
      min-height: 200px;
      background: rgba(32, 32, 40, 0.96);
      backdrop-filter: blur(20px);
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      color: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 100;
    }
    .window.focused {
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      z-index: 200;
    }
    .window-titlebar {
      height: 36px;
      background: rgba(24, 24, 32, 0.98);
      display: flex;
      align-items: center;
      padding: 0 12px;
      cursor: grab;
      flex-shrink: 0;
    }
    .window-titlebar:active { cursor: grabbing; }
    .window-titlebar .title {
      flex: 1;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .window-controls {
      display: flex;
      gap: 2px;
      margin-left: 8px;
    }
    .window-controls button {
      width: 32px;
      height: 28px;
      border: none;
      background: transparent;
      color: #999;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    .window-controls button:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .window-controls .close-btn:hover {
      background: #e81123;
      color: #fff;
    }
    .window-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }
    .window-body img.app-screenshot {
      width: 100%;
      max-width: 280px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .window-body h2 {
      font-size: 18px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .window-body p {
      font-size: 13px;
      color: #ccc;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .window-body .detail-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 20px;
      background: #60cdff;
      color: #000;
      text-decoration: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
    }
    .window-body .detail-btn:hover {
      background: #4db8e8;
    }
    .window-body .privacy-link {
      display: inline-block;
      margin-top: 8px;
      margin-left: 8px;
      color: #888;
      font-size: 12px;
      text-decoration: none;
    }
    .window-body .privacy-link:hover { color: #aaa; }
    .window-body .date-label {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
    }
  </style>
</head>
<body>

<!-- Desktop -->
<div id="desktop">
  <div class="desktop-icon" ondblclick="openWindow('nlp')">
    <img src="img/NLP.png" alt="NLP">
    <span>論文</span>
  </div>
  <div class="desktop-icon" ondblclick="openWindow('tripo')">
    <img src="img/tripo_icon.png" alt="Tripo">
    <span>Tripo</span>
  </div>
  <div class="desktop-icon" ondblclick="openWindow('tanzam')">
    <img src="img/TANZAM_icon.png" alt="TANZAM">
    <span>TANZAM</span>
  </div>
  <div class="desktop-icon" ondblclick="openWindow('palm')">
    <img src="img/screenshot_palmbookstore.png" alt="手のひら書店">
    <span>手のひら書店</span>
  </div>
  <div class="desktop-icon" ondblclick="openWindow('curabell')">
    <img src="img/screenshot_curabell.png" alt="クラベル">
    <span>クラベル</span>
  </div>
  <div class="desktop-icon" ondblclick="openWindow('minddiver')">
    <img src="img/screenshot_mindDiver.png" alt="マインドダイバー">
    <span>マインドダイバー</span>
  </div>
  <div class="desktop-icon" ondblclick="openWindow('fusen')">
    <img src="img/screenshot_postItNote.png" alt="ふせんメモ">
    <span>ふせんメモ</span>
  </div>
</div>

<!-- Start Menu -->
<div id="start-menu">
  <h3>Yuto Takebayashi</h3>
  <div class="profile-info">
    <p>このサイトは私の活動をまとめたものです。</p>
    <p><strong>氏名：</strong>竹林佑斗</p>
    <p><strong>趣味：</strong>旅行、キャンプ、ものづくり、アプリ開発、多肉植物</p>
    <p><strong>得意分野：</strong>自然言語処理、iPhoneアプリ開発</p>
    <p><strong>言語：</strong>日本語、英語、中国語（少し）、C言語、Python、Swift</p>
    <p style="margin-top: 12px; color: #888; font-size: 12px;">ご連絡はTwitterかFacebookからお願いします。</p>
  </div>
</div>

<!-- Taskbar -->
<div id="taskbar">
  <button id="start-btn" onclick="toggleStartMenu()" title="Profile">
    <i class="fas fa-user"></i>
  </button>
  <div id="taskbar-items"></div>
  <div id="taskbar-sns">
    <a href="https://m.facebook.com/profile.php?id=100003580254715" title="Facebook"><i class="fab fa-facebook-f"></i></a>
    <a href="https://twitter.com/ychiku66" title="Twitter"><i class="fab fa-twitter"></i></a>
    <a href="https://github.com/chikurin66" title="GitHub"><i class="fab fa-github"></i></a>
  </div>
  <div id="taskbar-clock"></div>
</div>

<script>
const apps = {
  nlp: {
    title: 'ニューラル機械翻訳における単語報酬モデルに基づく対訳辞書の利用',
    icon: 'img/NLP.png',
    screenshot: 'img/NLP.png',
    desc: ['大学院時代の研究を論文誌に投稿したもの。', 'J-STAGEで論文を閲覧できます。'],
    link: 'https://www.jstage.jst.go.jp/article/jnlp/26/4/26_711/_pdf/-char/ja',
    date: '2019年12月'
  },
  tripo: {
    title: 'Tripo',
    icon: 'img/tripo_icon.png',
    screenshot: 'img/tripo_icon.png',
    desc: ['旅行の経費精算を割り勘するアプリ', '大学時代の友人と二人で開発、運営', 'iPhoneのみ公開中'],
    link: 'https://peraichi.com/landing_pages/view/yo9o3',
    date: '2020年8月'
  },
  tanzam: {
    title: 'TANZAM',
    icon: 'img/TANZAM_icon.png',
    screenshot: 'img/TANZAM_icon.png',
    desc: ['イメージで英語を覚えられるアプリ', 'アプリ開発・システム部分を担当。他4人のメンバーと開発中。', 'iPhoneのみ公開中'],
    link: 'https://www.path-to-success.net/tanzam',
    date: '2021年2月'
  },
  palm: {
    title: '手のひら書店',
    icon: 'img/screenshot_palmbookstore.png',
    screenshot: 'img/screenshot_palmbookstore.png',
    desc: ['「本屋さんのワクワク感を手のひらに」をコンセプトにしたアプリ', '書籍の検索はできない。ジャンルを選んで新しい本との偶然の出会いを楽しむアプリ'],
    link: 'https://apps.apple.com/us/app/%E6%89%8B%E3%81%AE%E3%81%B2%E3%82%89%E6%9B%B8%E5%BA%97/id1563519741#?platform=iphone',
    privacy: './privacyPolicy_palmBookstore.html',
    date: '2021年5月'
  },
  curabell: {
    title: 'クラベル',
    icon: 'img/screenshot_curabell.png',
    screenshot: 'img/screenshot_curabell.png',
    desc: ['Amazonのお買い物をちょっと便利にするアプリ', '商品をリストに追加して、比較表を作成することができる。'],
    link: 'https://apps.apple.com/us/app/id1564438463',
    privacy: './privacyPolicy_curabell.html',
    date: '2021年5月'
  },
  minddiver: {
    title: 'マインドダイバー',
    icon: 'img/screenshot_mindDiver.png',
    screenshot: 'img/screenshot_mindDiver.png',
    desc: ['ランダムに出現する単語を選んでいくだけのアプリ', '気になる単語を選ぶことで、自動的に思考が顕在化する。マインドフルネス、瞑想のおともにどうぞ'],
    link: 'https://apps.apple.com/us/app/id1565646126',
    privacy: './privacyPolicy_mindDiver.html',
    date: '2021年5月'
  },
  fusen: {
    title: 'ふせんメモ',
    icon: 'img/screenshot_postItNote.png',
    screenshot: 'img/screenshot_postItNote.png',
    desc: ['シンプルなメモアプリ', '常に一枚しか作成できない。完了したタスクは横線で消せる。', '大学時代の友人と二人で開発、運営'],
    link: 'https://apps.apple.com/jp/app/%E3%81%B5%E3%81%9B%E3%82%93%E3%83%A1%E3%83%A2-%E3%82%BF%E3%82%B9%E3%82%AF%E7%AE%A1%E7%90%86%E3%81%AE%E3%81%9F%E3%82%81%E3%81%AE%E3%81%B5%E3%81%9B%E3%82%93/id1565766530#?platform=iphone',
    privacy: './privacyPolicy_postItNote.html',
    date: '2021年5月'
  }
};

const openWindows = {};
let zCounter = 100;
let offsetX = 0, offsetY = 0;

function openWindow(id) {
  if (openWindows[id]) {
    focusWindow(id);
    return;
  }

  const app = apps[id];
  const win = document.createElement('div');
  win.className = 'window focused';
  win.id = 'win-' + id;
  win.style.width = '420px';
  win.style.height = '460px';
  win.style.left = (80 + Object.keys(openWindows).length * 30) + 'px';
  win.style.top = (40 + Object.keys(openWindows).length * 30) + 'px';
  win.style.zIndex = ++zCounter;

  let bodyHTML = '';
  if (app.screenshot) {
    bodyHTML += '<img class="app-screenshot" src="' + app.screenshot + '" alt="' + app.title + '">';
  }
  bodyHTML += '<h2>' + app.title + '</h2>';
  app.desc.forEach(function(d) { bodyHTML += '<p>' + d + '</p>'; });
  bodyHTML += '<a class="detail-btn" href="' + app.link + '" target="_blank">詳細を見る</a>';
  if (app.privacy) {
    bodyHTML += '<a class="privacy-link" href="' + app.privacy + '">プライバシーポリシー</a>';
  }
  bodyHTML += '<p class="date-label">' + app.date + '</p>';

  win.innerHTML =
    '<div class="window-titlebar" onmousedown="startDrag(event, \'' + id + '\')">' +
      '<span class="title">' + app.title + '</span>' +
      '<div class="window-controls">' +
        '<button class="close-btn" onclick="closeWindow(\'' + id + '\')">&#x2715;</button>' +
      '</div>' +
    '</div>' +
    '<div class="window-body">' + bodyHTML + '</div>';

  win.addEventListener('mousedown', function() { focusWindow(id); });
  document.getElementById('desktop').appendChild(win);
  openWindows[id] = win;
  updateTaskbar();
}

function closeWindow(id) {
  const win = openWindows[id];
  if (win) {
    win.remove();
    delete openWindows[id];
    updateTaskbar();
  }
}

function focusWindow(id) {
  Object.values(openWindows).forEach(function(w) { w.classList.remove('focused'); });
  const win = openWindows[id];
  if (win) {
    win.style.zIndex = ++zCounter;
    win.classList.add('focused');
  }
  document.querySelectorAll('.taskbar-item').forEach(function(item) {
    item.classList.toggle('active', item.dataset.id === id);
  });
}

// Drag
let dragTarget = null;
function startDrag(e, id) {
  dragTarget = id;
  const win = openWindows[id];
  offsetX = e.clientX - win.offsetLeft;
  offsetY = e.clientY - win.offsetTop;
  focusWindow(id);
  e.preventDefault();
}
document.addEventListener('mousemove', function(e) {
  if (!dragTarget) return;
  const win = openWindows[dragTarget];
  if (!win) return;
  win.style.left = (e.clientX - offsetX) + 'px';
  win.style.top = (e.clientY - offsetY) + 'px';
});
document.addEventListener('mouseup', function() { dragTarget = null; });

// Taskbar
function updateTaskbar() {
  const container = document.getElementById('taskbar-items');
  container.innerHTML = '';
  Object.keys(openWindows).forEach(function(id) {
    const app = apps[id];
    const btn = document.createElement('button');
    btn.className = 'taskbar-item';
    btn.dataset.id = id;
    btn.innerHTML = '<img src="' + app.icon + '" alt="">' + app.title;
    btn.onclick = function() { focusWindow(id); };
    container.appendChild(btn);
  });
}

// Start menu
function toggleStartMenu() {
  document.getElementById('start-menu').classList.toggle('show');
}
document.getElementById('desktop').addEventListener('click', function() {
  document.getElementById('start-menu').classList.remove('show');
});

// Clock
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const d = (now.getMonth() + 1) + '/' + now.getDate();
  document.getElementById('taskbar-clock').innerHTML = h + ':' + m + '<br>' + d;
}
updateClock();
setInterval(updateClock, 30000);
</script>
</body>
</html>
